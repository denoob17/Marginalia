<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="quillTitle">
  <title id="quillTitle">Quill pen resting beside an open ink bottle</title>
  <circle cx="100" cy="100" r="92" fill="#2a2723" stroke="#4a443c" stroke-width="2"/>
  <!-- ink bottle -->
  <rect x="60" y="120" width="34" height="30" rx="3" fill="#34302a" stroke="#7c8a72" stroke-width="2"/>
  <rect x="68" y="110" width="18" height="12" fill="#34302a" stroke="#7c8a72" stroke-width="2"/>
  <ellipse cx="77" cy="135" rx="10" ry="6" fill="#12110f"/>
  <!-- feather quill -->
  <path d="M77 118 C 95 95, 110 70, 140 50" fill="none" stroke="#b5915b" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 100 C 105 92, 112 84, 118 74" fill="none" stroke="#b5915b" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 108 C 98 100, 106 92, 112 82" fill="none" stroke="#b5915b" stroke-width="2" stroke-linecap="round"/>
  <path d="M104 90 C 112 82, 120 74, 126 66" fill="none" stroke="#b5915b" stroke-width="2" stroke-linecap="round"/>
  <path d="M140 50 C 148 42, 152 38, 156 30" fill="none" stroke="#a97c74" stroke-width="3" stroke-linecap="round"/>
  <!-- small ink drop -->
  <circle cx="80" cy="126" r="2.5" fill="#a97c74"/>
</svg>
